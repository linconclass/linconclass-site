name: Build Lincon Class Preview

on:
  push:
    branches:
      - audit/lincon-class-2026
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LinconClass.csproj

      - name: Publish
        run: dotnet publish LinconClass.csproj -c Release -o publish

      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: lincon-class-preview
          path: publish/wwwroot
          if-no-files-found: error
